<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Calendar — Announcement & Event Track App</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css' rel='stylesheet' />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --bg-dark: #0f172a;
            --bg-darker: #020617;
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .filter-group label {
            color: var(--text-muted);
            font-weight: 600;
        }

        select {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-light);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:hover {
            border-color: var(--primary);
        }

        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
        }

        .view-toggle {
            display: flex;
            gap: 0.5rem;
            background: var(--border);
            padding: 0.3rem;
            border-radius: 6px;
        }

        .view-btn {
            background: transparent;
            border: none;
            color: var(--text-light);
            padding: 0.6rem 1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
            font-weight: 600;
        }

        .view-btn.active {
            background: var(--primary);
            color: white;
        }

        .view-btn:hover {
            color: var(--primary);
        }

        /* Calendar Container */
        .calendar-wrapper {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        /* FullCalendar Styling */
        .fc {
            color: var(--text-light);
        }

        .fc-button {
            background-color: var(--primary) !important;
            border-color: var(--primary) !important;
            text-transform: capitalize !important;
        }

        .fc-button:hover {
            background-color: var(--secondary) !important;
            border-color: var(--secondary) !important;
        }

        .fc-button-active {
            background-color: var(--secondary) !important;
            border-color: var(--secondary) !important;
        }

        .fc-daygrid-day {
            background: var(--bg-darker);
            border-color: var(--border);
        }

        .fc-daygrid-day:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        .fc-daygrid-day.fc-day-other {
            background: rgba(15, 23, 42, 0.5);
        }

        .fc-daygrid-day-frame {
            background: var(--bg-darker);
        }

        .fc-col-header {
            background: var(--bg-darker);
            border-color: var(--border);
        }

        .fc-col-header-cell {
            color: var(--text-muted);
            padding: 1rem 0;
            font-weight: 600;
        }

        .fc-daygrid-day-number {
            color: var(--text-light);
            padding: 0.5rem;
        }

        .fc-daygrid-day.fc-day-today {
            background: rgba(16, 185, 129, 0.1);
        }

        .fc-daygrid-day.fc-day-today .fc-daygrid-day-number {
            background: var(--success);
            color: white;
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
        }

        .fc-event {
            background: var(--primary) !important;
            border: none !important;
            padding: 0.3rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .fc-event.workshop {
            background: #3b82f6 !important;
        }

        .fc-event.lecture {
            background: #8b5cf6 !important;
        }

        .fc-event.meetup {
            background: #ec4899 !important;
        }

        .fc-event.deadline {
            background: #ef4444 !important;
        }

        .fc-event.announcement {
            background: #f59e0b !important;
        }

        .fc-event-title {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fc-daygrid-day-frame {
            min-height: 120px;
        }

        /* Sidebar */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 2rem;
        }

        .sidebar {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            height: fit-content;
        }

        .sidebar h3 {
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .event-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .event-item {
            background: var(--bg-darker);
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            transition: all 0.3s;
            cursor: pointer;
        }

        .event-item:hover {
            border-left-color: var(--secondary);
            transform: translateX(5px);
        }

        .event-item.workshop {
            border-left-color: #3b82f6;
        }

        .event-item.lecture {
            border-left-color: #8b5cf6;
        }

        .event-item.meetup {
            border-left-color: #ec4899;
        }

        .event-item.deadline {
            border-left-color: #ef4444;
        }

        .event-item.announcement {
            border-left-color: #f59e0b;
        }

        .event-title {
            font-weight: 600;
            margin-bottom: 0.3rem;
            font-size: 0.95rem;
        }

        .event-date {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .event-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 0.5rem;
            background: var(--primary);
            color: white;
        }

        .event-item.workshop .event-badge {
            background: #3b82f6;
        }

        .event-item.lecture .event-badge {
            background: #8b5cf6;
        }

        .event-item.meetup .event-badge {
            background: #ec4899;
        }

        .event-item.deadline .event-badge {
            background: #ef4444;
        }

        .event-item.announcement .event-badge {
            background: #f59e0b;
        }

        /* Legend */
        .legend {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .legend h4 {
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .legend-items {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h2 {
            font-size: 1.5rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: var(--accent);
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.8rem 0;
            border-bottom: 1px solid var(--border);
        }

        .detail-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .detail-value {
            color: var(--text-light);
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--secondary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .calendar-wrapper {
                padding: 1rem;
            }

            .fc-daygrid-day-frame {
                min-height: 80px;
            }

            .controls {
                flex-direction: column;
            }

            .filter-group {
                width: 100%;
            }

            select {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>📅 Event Calendar</h1>
            <p class="subtitle">Track all your events, announcements, and deadlines in one place</p>
        </header>

        <!-- Controls -->
        <div class="controls">
            <div class="filter-group">
                <label for="categoryFilter">Category:</label>
                <select id="categoryFilter">
                    <option value="all">All Events</option>
                    <option value="workshop">Workshop</option>
                    <option value="lecture">Lecture</option>
                    <option value="meetup">Meetup</option>
                    <option value="deadline">Deadline</option>
                    <option value="announcement">Announcement</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="monthFilter">Month:</label>
                <select id="monthFilter">
                    <option value="">Current Month</option>
                    <option value="2024-01">January</option>
                    <option value="2024-02">February</option>
                    <option value="2024-03">March</option>
                </select>
            </div>

            <div class="view-toggle">
                <button class="view-btn active" data-view="dayGridMonth">Month</button>
                <button class="view-btn" data-view="timeGridWeek">Week</button>
                <button class="view-btn" data-view="timeGridDay">Day</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Calendar -->
            <div class="calendar-wrapper">
                <div id="calendar"></div>
            </div>

            <!-- Sidebar -->
            <aside class="sidebar">
                <h3>📌 Upcoming Events</h3>

                <div class="event-list" id="eventList">
                    <!-- Events will be populated here -->
                </div>

                <!-- Legend -->
                <div class="legend">
                    <h4>CATEGORIES</h4>
                    <div class="legend-items">
                        <div class="legend-item">
                            <div class="legend-color" style="background: #3b82f6;"></div>
                            <span>Workshop</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #8b5cf6;"></div>
                            <span>Lecture</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #ec4899;"></div>
                            <span>Meetup</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #ef4444;"></div>
                            <span>Deadline</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #f59e0b;"></div>
                            <span>Announcement</span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Event Detail Modal -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Event Details</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Event details will be populated here -->
            </div>
        </div>
    </div>

    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <script>
        // Sample Events
        const events = [
            // Workshops
            {
                id: 1,
                title: 'React Advanced Patterns Workshop',
                start: '2024-01-15T09:00:00',
                end: '2024-01-15T11:00:00',
                category: 'workshop',
                description: 'Learn advanced React patterns including hooks, context, and custom implementations.',
                location: 'Room 201',
                attendees: 45,
                organizer: 'Tech Team'
            },
            {
                id: 2,
                title: 'Backend Architecture Workshop',
                start: '2024-01-22T10:00:00',
                end: '2024-01-22T12:00:00',
                category: 'workshop',
                description: 'Explore microservices, API design, and scalability patterns.',
                location: 'Auditorium A',
                attendees: 60,
                organizer: 'Engineering'
            },
            // Lectures
            {
                id: 3,
                title: 'Database Optimization Lecture',
                start: '2024-01-18T14:00:00',
                end: '2024-01-18T15:30:00',
                category: 'lecture',
                description: 'Practical tips for optimizing database queries and improving performance.',
                location: 'Lecture Hall 1',
                attendees: 80,
                organizer: 'Data Team'
            },
            {
                id: 4,
                title: 'Cloud Computing Basics',
                start: '2024-01-25T14:00:00',
                end: '2024-01-25T15:30:00',
                category: 'lecture',
                description: 'Introduction to AWS, Azure, and Google Cloud platforms.',
                location: 'Lecture Hall 2',
                attendees: 75,
                organizer: 'DevOps'
            },
            // Meetups
            {
                id: 5,
                title: 'Developer Meetup - January',
                start: '2024-01-20T18:00:00',
                end: '2024-01-20T20:00:00',
                category: 'meetup',
                description: 'Casual meetup with developers to discuss projects and network.',
                location: 'Café Downtown',
                attendees: 30,
                organizer: 'Community'
            },
            {
                id: 6,
                title: 'AI/ML Discussion Group',
                start: '2024-01-27T17:00:00',
                end: '2024-01-27T19:00:00',
                category: 'meetup',
                description: 'Monthly discussion on AI trends, ML projects, and innovation.',
                location: 'Room 301',
                attendees: 25,
                organizer: 'AI Team'
            },
            // Deadlines
            {
                id: 7,
                title: 'Project Submission Deadline',
                start: '2024-01-31T23:59:00',
                end: '2024-02-01T00:00:00',
                category: 'deadline',
                description: 'Final deadline for Q1 project submissions.',
                location: 'Online',
                attendees: 200,
                organizer: 'Admin'
            },
            {
                id: 8,
                title: 'Assignment 2 Due',
                start: '2024-01-19T23:59:00',
                end: '2024-01-20T00:00:00',
                category: 'deadline',
                description: 'Complete assignment 2 on backend development.',
                location: 'Online',
                attendees: 150,
                organizer: 'Education'
            },
            // Announcements
            {
                id: 9,
                title: 'New Training Program Launch',
                start: '2024-01-16T10:00:00',
                end: '2024-01-16T10:30:00',
                category: 'announcement',
                description: 'We are launching a new comprehensive training program on Cloud Technologies.',
                location: 'Online',
                attendees: 500,
                organizer: 'HR'
            },
            {
                id: 10,
                title: 'Office Reopening Notice',
                start: '2024-01-23T09:00:00',
                end: '2024-01-23T09:30:00',
                category: 'announcement',
                description: 'Main office reopening after maintenance. All staff return to office.',
                location: 'Headquarters',
                attendees: 300,
                organizer: 'Management'
            }
        ];

        let calendar;
        let filteredEvents = [...events];

        // Initialize Calendar
        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                events: events.map(event => ({
                    id: event.id,
                    title: event.title,
                    start: event.start,
                    end: event.end,
                    classNames: [event.category],
                    extendedProps: {
                        category: event.category,
                        description: event.description,
                        location: event.location,
                        attendees: event.attendees,
                        organizer: event.organizer
                    }
                })),
                eventClick: function(info) {
                    showEventDetails(info.event);
                },
                datesSet: function(info) {
                    updateUpcomingEvents();
                }
            });
            calendar.render();
            updateUpcomingEvents();
        });

        // Show Event Details Modal
        function showEventDetails(event) {
            const modal = document.getElementById('eventModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');

            const startTime = new Date(event.start).toLocaleString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });

            modalTitle.textContent = event.title;
            modalBody.innerHTML = `
                <div class="detail-row">
                    <span class="detail-label">📅 Date & Time</span>
                    <span class="detail-value">${startTime}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">📍 Location</span>
                    <span class="detail-value">${event.extendedProps.location}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">👥 Attendees</span>
                    <span class="detail-value">${event.extendedProps.attendees} people</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">👤 Organizer</span>
                    <span class="detail-value">${event.extendedProps.organizer}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">🏷️ Category</span>
                    <span class="detail-value" style="text-transform: capitalize;">${event.extendedProps.category}</span>
                </div>
                <div style="padding: 1rem 0; border-top: 1px solid var(--border); margin-top: 1rem;">
                    <p style="color: var(--text-muted); line-height: 1.6;">${event.extendedProps.description}</p>
                </div>
                <button class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    <i class="fas fa-check"></i> Mark as Attending
                </button>
            `;

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('eventModal').classList.remove('active');
        }

        // Update Upcoming Events List
        function updateUpcomingEvents() {
            const eventList = document.getElementById('eventList');
            const now = new Date();
            const upcoming = events
                .filter(e => new Date(e.start) > now)
                .sort((a, b) => new Date(a.start) - new Date(b.start))
                .slice(0, 5);

            eventList.innerHTML = upcoming.map(event => `
                <div class="event-item ${event.category}" onclick="highlightEvent(${event.id})">
                    <div class="event-title">${event.title}</div>
                    <div class="event-date">
                        <i class="far fa-clock"></i>
                        ${new Date(event.start).toLocaleDateString()} - ${new Date(event.start).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}
                    </div>
                    <div class="event-badge">${event.category.toUpperCase()}</div>
                </div>
            `).join('');
        }

        // Highlight Event on Click
        function highlightEvent(eventId) {
            const event = events.find(e => e.id === eventId);
            if (event) {
                showEventDetails({
                    title: event.title,
                    start: event.start,
                    end: event.end,
                    extendedProps: {
                        category: event.category,
                        description: event.description,
                        location: event.location,
                        attendees: event.attendees,
                        organizer: event.organizer
                    }
                });
            }
        }

        // Filter Events
        document.getElementById('categoryFilter').addEventListener('change', function(e) {
            const category = e.target.value;
            if (category === 'all') {
                calendar.getEvents().forEach(event => event.setProp('display', 'auto'));
            } else {
                calendar.getEvents().forEach(event => {
                    event.setProp('display', event.extendedProps.category === category ? 'auto' : 'none');
                });
            }
        });

        // Close modal when clicking outside
        document.getElementById('eventModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
